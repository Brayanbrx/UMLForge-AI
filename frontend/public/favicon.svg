<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UMLFORGE AI">
  <!--
    Marca de UMLFORGE AI.

    Dos clases unidas por una asociación en ángulo recto: es literalmente lo
    que hace la herramienta, y a tamaño de pestaña se sigue reconociendo como
    un diagrama y no como un icono genérico.

    La chispa ámbar es la forja. Va en la esquina libre, donde no compite con
    las cajas, y a 16 píxeles aporta color aunque se pierda la forma de estrella.

    Fondo sólido y no un trazo suelto: un contorno fino desaparece contra el
    gris del navegador.
  -->
  <rect width="64" height="64" rx="14" fill="#2F78C4" />

  <!-- Asociación: sale de la clase de arriba, baja y entra por la izquierda
       de la de abajo. Debajo de las cajas para que no se le vean los extremos. -->
  <path
    d="M20 24v18a3 3 0 0 0 3 3h13"
    fill="none"
    stroke="#fff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />

  <!-- Clase superior, con su compartimento de nombre -->
  <rect x="9" y="12" width="22" height="16" rx="3.5" fill="#fff" />
  <rect x="9" y="12" width="22" height="6" rx="3.5" fill="#A8C8EA" />

  <!-- Clase inferior -->
  <rect x="33" y="37" width="22" height="16" rx="3.5" fill="#fff" />
  <rect x="33" y="37" width="22" height="6" rx="3.5" fill="#A8C8EA" />

  <!-- La chispa de la forja, en la esquina que queda libre -->
  <path
    d="M46 10.5c1.2 4.6 2.2 5.6 6.8 6.8-4.6 1.2-5.6 2.2-6.8 6.8-1.2-4.6-2.2-5.6-6.8-6.8 4.6-1.2 5.6-2.2 6.8-6.8Z"
    fill="#F5A524"
  />
</svg>
